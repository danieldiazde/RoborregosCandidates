; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32

[arduino_base]
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra -I include

[env:esp32]
extends = arduino_base
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
lib_deps =
    types
    grid
    robot_io
    maze
lib_ignore =
    maze_gen
    robot_io_fake
build_unflags = -std=gnu++11
build_flags = ${arduino_base.build_flags} -std=gnu++17 -DARDUINO_USB_CDC_ON_BOOT=1

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -I include

[env:bench]
platform = native
build_flags = -std=c++17 -O2 -Wall -Wextra -I include
build_src_filter = -<*> +<../bench/bench_main.cpp>
